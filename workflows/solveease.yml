name: SolveEase Scheduled Research

on:
workflow_dispatch:
schedule:
- cron: "17 */6 * * *"

permissions:
contents: read

concurrency:
group: solveease-research
cancel-in-progress: false

jobs:
research:
runs-on: ubuntu-latest
timeout-minutes: 10

steps:
  - name: Check out repository
    uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"

  - name: Install dependencies
    run: python -m pip install -r requirements.txt

  - name: Run SolveEase research demo
    run: python -m solvease --db solveease_ledger.sqlite3

  - name: Save run output
    if: always()
    run: |
      echo "SolveEase scheduled run finished."
      echo "Check the preceding steps for actual results or errors."
